<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 04 - formulários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"&gt;
</head>

<body class="bg-light">
    <div class="container my-5">
        <div class="row justfy-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4">Criar conta</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="João" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Silva" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Usúario</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" placeholder="JoãoSilva">
                                </div>
                            </div>
                           <div class="col-12"><label class="form-label">Àrea de interesse</label>
                            <select class="form-select">
                                <option selected>escolha uma opção:</option>
                                <option value="1">Front-end</option>
                                <option value="2">Back-end</option>
                                <option value="3">Full-stack</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="termos">
                                <label for="termos" class="form-check-label">
                                    Concordo com os termos de uso
                                </label>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button class="btn btn-success w-100" type="submit">Finalizar Cadastro</button>
                        </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
